# [release] path normalization applied (every `data/` path -> `data/phase1/`, because the phase-1 data tree now lives under the release data root); see docs/KNOWN_ISSUES.md §1
# WPAC Tropical Cyclone Causal Inference — Phase 1 Configuration
# All paths are relative to project root (where main.py resides)

version: "wpac_dv24_v1.0"

# =============================================================================
# 1. Data Paths
# =============================================================================
data:
  ibtracs_path: "data/phase1/raw/ibtracs/ibtracs.WP.list.v04r01.csv"
  ibtracs_url: "https://www.ncei.noaa.gov/data/international-best-track-archive-for-climate-stewardship-ibtracs/v04r01/access/csv/ibtracs.WP.list.v04r01.csv"
  era5_download_dir: "data/phase1/raw/era5"
  ohc_dir: "data/phase1/raw/ohc"               # per-storm {SID}/{SID}_ohc.nc (daily, kJ/cm^2)
  output_dir: "data/phase1/processed"
  log_dir: "data/phase1/processed/logs"      # unused by src; logging.file is authoritative
  retry_json: "data/phase1/processed/retry.json"

# Time range and basin filter
  years: [2000, 2024]              # analysis window per project spec (NO 2025)
  basin: "WP"

# RI threshold: only for statistical reference, NOT used as target variable
  ri_threshold: 30  # kt

# =============================================================================
# 2. Best Track Configuration
# =============================================================================
best_track:
  intensity_col: "USA_WIND"      # 1-min sustained wind (kt)
  lat_col: "USA_LAT"
  lon_col: "USA_LON"
  time_col: "ISO_TIME"
  id_col: "SID"
  name_col: "NAME"
  pres_col: "USA_PRES"           # optional, for validation

  min_intensity: 0               # keep full lifecycle including TD
  storm_min_peak_intensity: 65   # keep only storms with peak VMAX >= 65 kt (analysis sample definition)
  backfilled_sids:               # storms whose ERA5/OHC were backfilled in the 2026-07 rerun (R3-4)
    - "2009196N14129"            # MOLAVE 2009
    - "2013178N09133"            # RUMBIA 2013
  forecast_horizon: 4            # 6h × 4 = 24h lookahead

# Lifecycle stage definitions [min, max) in kt
  lifecycle_stages:
    formation: [0, 25]
    intensification: [25, 65]
    mature: [65, 100]
    extreme: [100, 999]

# Distance to land calculation (documentary only — compute_land_distance calls
# utils.distance_to_land directly and does not read these, D report §1.2)
  land_distance:
    method: "gshhg"              # "gshhg" or "etopo1"
    resolution: "f"              # gshhg resolution: c, l, i, h, f
    etopo1_path: null            # optional path to ETOPO1 NetCDF

# =============================================================================
# 3. ERA5 Download Configuration
# =============================================================================
era5:
  # CDS API credentials: auto-reads ~/.cdsapirc or env var CDSAPI_KEY
  cds_dataset_pl: "reanalysis-era5-pressure-levels"
  cds_dataset_sl: "reanalysis-era5-single-levels"

  pressure_levels: [1000, 925, 850, 700, 500, 300, 200]  # hPa

  pl_variables:
    - "geopotential"
    - "temperature"
    - "u_component_of_wind"
    - "v_component_of_wind"
    - "relative_humidity"
    - "specific_humidity"
    - "vertical_velocity"
    - "divergence"
    - "potential_vorticity"

  sl_variables:
    - "sea_surface_temperature"
    - "mean_sea_level_pressure"
    - "2m_temperature"
    - "surface_latent_heat_flux"
    - "top_net_thermal_radiation"    # OLR proxy

  # Spatial/temporal subsetting per storm
  spatial_buffer_deg: 15           # bbox = storm track extrema ± buffer
  temporal_buffer_days: 1          # extend start/end by 1 day
  time_resolution_hours: 6         # 00, 06, 12, 18 UTC (documentary; 6h cadence is hardcoded in best_track.resample_to_6h)

  # Download behavior
  download_retry: 3                # max retries per storm
  download_timeout: 600            # seconds per request
  download_sleep: 60               # seconds to sleep after CDS rate-limit
  skip_existing: true              # skip if file exists and size > 0

  # Batch download settings (consumed by ad-hoc download scripts in the repo
  # root, NOT by src/ — kept for those scripts, D report §1.2)
  max_concurrent_downloads: 2      # CDS queue limit: max parallel downloads
  cds_queue_limit: 2               # max queued requests on CDS server

# =============================================================================
# 4. Extraction & Derived Variables
# =============================================================================
extraction:
  # Annulus definitions [inner, outer] in degrees
  inner_core_radius: [0, 2]        # IC: 0°–2°
  outer_area_radius: [2, 8]        # OA: 2°–8°

  # Whether to use planar distance (fast) or haversine (accurate)
  use_planar_distance: true        # planar is sufficient for <8°

  # Derived variables to compute (must match metpy calculations in code)
  derived_variables:
    - "SHRD"          # 200-850 hPa vertical wind shear magnitude, OA
    - "USHR"          # 200-850 hPa zonal wind shear, OA
    - "VSHR"          # 200-850 hPa meridional wind shear, OA
    - "SHEAR_DIR"     # wind shear vector direction (°), OA
    - "SHEAR_VMAX_ANGLE"  # angle between shear and TC motion (°), OA
    - "D200"          # 200 hPa divergence (10^-6 s^-1), OA
    - "RHLO"          # 850-700 hPa mean RH (%), OA
    - "RHHI"          # 500-300 hPa mean RH (%), OA
    - "VORT"          # 850 hPa relative vorticity (10^-5 s^-1), IC
    - "PV"            # 500 hPa potential vorticity, IC
    - "TPW"           # total precipitable water (kg/m^2), OA
    - "SST_OA"        # outer area SST (°C), OA
    - "SST_IC"        # inner core SST (°C), IC
    - "OHC_IC"        # ocean heat content rel. 26°C isotherm (kJ/cm²), IC
    - "OHC_OA"        # ocean heat content rel. 26°C isotherm (kJ/cm²), OA
    - "POT"           # potential intensity deficit (kt) — STRATIFICATION ONLY (R2-1):
                      # not a causal-graph node nor a treatment (deterministic
                      # function of SST_OA and VMAX); kept in the panel for the
                      # headroom effect-modification analysis
    - "WARM_CORE"     # 200 hPa T anomaly IC minus OA (K)
    - "MFC"           # 850 hPa moisture flux convergence, OA
    - "SLHF_IC"       # surface latent heat flux (W/m², ocean→atmosphere positive), IC
    - "DRY_AIR"       # dry air intrusion metric, OA
    - "W500"          # 500 hPa vertical velocity (Pa/s), OA

  # Variable availability flags (set false if external data unavailable)
  optional_variables:
    POT: true        # simplified from SST
    WARM_CORE: true  # from ERA5 temperature
    MFC: true        # from ERA5 q, u, v
    SLHF_IC: true    # from ERA5 SLHF (1h accumulation / 3600s, sign-flipped)
    DRY_AIR: true    # from ERA5 RH
    OHC: true        # per-storm daily OHC in data/phase1/raw/ohc (373/373 coverage)

# =============================================================================
# 5. Preprocessing & Transformations
# =============================================================================
preprocessing:
  # Yeo-Johnson transformation for target DV24
  yj_transformer_path: "data/phase1/processed/dv24_yj_transformer.pkl"

  # Winsorization bounds
  winsorize_limits: [0.01, 0.99]   # [1%, 99%] quantiles

  # Z-score scaler
  scaler_path: "data/phase1/processed/feature_scaler.pkl"
  scaler_fit_years: [2000, 2018]   # fit on training period only

  # Minimum observations per storm for inclusion
  min_obs_per_storm: 5

# =============================================================================
# 6. Causal Discovery (TiGraMITe PCMCI+)
# =============================================================================
causal_discovery:
  target: "DV24_YJ"

  # Variable list for causal graph (ORDER MATTERS for tigramite DataFrame)
  variables:
    - "VMAX"
    - "PER"
    - "SPD"
    - "LAT"
    - "LAND_DIST"
    - "SHRD"
    - "SHEAR_VMAX_ANGLE"
    - "D200"
    - "RHLO"
    - "RHHI"
    - "VORT"
    - "PV"
    - "SST_OA"
    - "SST_IC"
    - "OHC_OA"
    - "OHC_IC"
    # POT deliberately REMOVED from the causal graph (R2-1): POT = PI - VMAX is a
    # deterministic function of graph nodes SST_OA and VMAX (faithfulness
    # violation), and its -VMAX component forms a bookkeeping identity with
    # DV24 = VMAX(t+24h) - VMAX(t), making its negative ATE a mechanical
    # artefact. POT stays in the panel for stratification only (headroom CATE).
    - "WARM_CORE"
    - "MFC"
    - "SLHF_IC"
    - "DRY_AIR"
    - "W500"
    - "DV24_YJ"

  # Time series parameters
  tau_max: 4                       # max lag = 4 timesteps = 24h
  tau_min: 0
  pc_alpha: 0.01                   # conservative significance threshold (unified with code default & CAUSAL_FRAMEWORK §4.3)
  independence_test: "ParCorr"     # partial correlation
  mask_type: "xyz"                 # exclude samples masked in X, Y, or any Z
  fdr_method: "fdr_bh"             # Benjamini-Hochberg FDR correction on PCMCI+ p-values

  # X -> DV24_YJ lag-0 edges (§4.4). true = design default; false = lag>=1
  # sensitivity mode with only the exceptions listed below (set [] for strict).
  allow_target_lag0: true
  target_lag0_exceptions: ["VMAX"]

  # PCMCI+ specific (reserved for future tuning; not currently read by
  # src/causal_discovery.py, D report §1.2)
  pc_alpha_oracle: null            # use same as pc_alpha if null
  max_combinations: 1              # default for speed

  # Output
  results_pkl: "data/phase1/processed/pcmci_results.pkl"
  graph_png: "data/phase1/processed/causal_graph.png"
  graph_dot: "data/phase1/processed/causal_graph.dot"

# =============================================================================
# 7. Effect Estimation (DoWhy)
# =============================================================================
effect_estimation:
  # Dual targets: continuous DV24 + binary RI
  target_original: "DV24"
  target_binary: "RI"
  mediator: "DV24"

  # Candidate treatments with direct or indirect identification paths on the
  # identification DAG; not all are discovered direct parents of DV24.
  # POT removed (R2-1, deterministic derived variable — see causal_discovery).
  # OHC_IC and OHC_OA are included when present in the discovery graph.
  treatments:
    - "SHRD"
    - "RHLO"
    - "VORT"
    - "PV"
    - "D200"
    - "WARM_CORE"
    - "MFC"
    - "W500"
    - "OHC_IC"
    - "OHC_OA"

  # Headroom effect-modification analysis (R2-1): stratify by PI - VMAX
  # (intensification room, kt) computed from RAW SST_OA (z-score inverted via
  # the saved scaler). Report as "environmental effects varying with
  # intensification room" — never as "deficit causes RI".
  headroom:
    enabled: true
    bins: [-inf, 30, 60, inf]      # kt of PI - VMAX
    labels: ["low(<30kt)", "mid(30-60kt)", "high(>60kt)"]
    treatments: ["SST_OA", "SST_IC", "OHC_IC", "RHLO", "SHRD"]

  # Estimation methods
  ate_method: "backdoor.linear_regression"
  ate_method_nonlinear: "backdoor.generalized_linear_model"

  # CATE stratification dimensions
  cate_dimensions: ["LC_STAGE", "LAT_BIN", "VMAX_BIN"]

  # Bin edges for CATE
  cate_bins:
    lat: [0, 15, 25, 45]           # °N
    vmax: [0, 25, 65, 100]         # kt

  # Output files
  ate_csv: "data/phase1/processed/ate_results.csv"
  cate_csv: "data/phase1/processed/cate_results.csv"
  refutation_md: "data/phase1/processed/refutation_report.md"

  # Regime stratification for mechanism-specific analysis.
  # stratify_by MUST be a pre-treatment (time-t observable) variable —
  # stratifying by the outcome DV24 itself is conditioning on the outcome
  # (truncation bias, review B-C2).  PER = past 6h intensity trend (kt/6h);
  # 7.5 kt/6h = 30 kt/24h, i.e. the ongoing-RI pace.
  regime:
    enabled: true
    stratify_by: "PER"
    bins: [-inf, 0, 7.5, inf]
    labels: ["weakening", "moderate", "RI"]
    comparison_baseline: "moderate"
    ri_specific_threshold: 3.0

  # SHRD nonlinear (binned) analysis — bins in kt on raw (pre-scaling) shear
  shrd_nonlinear:
    enabled: true
    bins: [0, 5, 15, inf]
    labels: ["low", "moderate", "high"]
    reference: "moderate"

  # Thresholds for qualitative factor-type classification
  qualitative:
    threshold_dv24: 2.0
    threshold_ri: 0.02

  # Block bootstrap inference (cluster by SID) — primary uncertainty measure;
  # analytic p-values are anti-conservative with overlapping 24h windows (P1-2)
  bootstrap:
    enabled: true
    B: 200
    seed: 42

  # Refutation test parameters
  refutation:
    random_seed: 42                # reproducibility of placebo/subset/UC refuters (FIX_TASKS P0-7)
    placebo:
      type: "permute"
      pass_threshold: 0.30         # |placebo_effect| < 0.30 * |original_effect|
    subset:
      fraction: 0.9
      num_runs: 3
      pass_threshold: 0.20         # |delta| < 20%
    unobserved_confounder:
      effect_strength_on_treatment: 0.3
      effect_strength_on_outcome: 0.3
      pass_threshold: 0.25         # |delta| < 25%
    offshore:
      land_dist_threshold: 100     # km
      pass_threshold: 0.20

# =============================================================================
# 8. Knowledge Base Output
# =============================================================================
knowledge_base:
  output_yaml: "data/phase1/processed/causal_effects_db.yaml"
  schema_version: "wpac_dv24_v1.0"
  # Stage-2 machine-readable causal graph export (edges with lag/coef/sign/p)
  graph_edges_json: "data/phase1/processed/causal_graph_edges.json"

# =============================================================================
# 9. External Indices (NOT yet consumed by src/ — placeholder for the planned
#    MJO/ENSO confounder extension, D report §1.2 / E report §1.1)
# =============================================================================
external_indices:
  # MJO / ISO
  mjo:
    enabled: true
    source: "omi"                  # "omi" (Wheeler-Hendon) or "era5_proxy"
    omi_url: "https://psl.noaa.gov/data/correlation/omi.indices.txt"
    omi_path: "data/phase1/raw/omi_indices.txt"

  # ENSO
  enso:
    enabled: true
    source: "noaa_cpc"
    nino34_url: "https://www.cpc.ncep.noaa.gov/data/indices/sstoi.indices"
    nino34_path: "data/phase1/raw/nino34_indices.txt"

# =============================================================================
# 10. Execution Control
# =============================================================================
execution:
  phases:
    - "download"
    - "best_track"
    - "preprocessing"
    - "causal_discovery"
    - "effect_estimation"
    - "knowledge_base"

  # Parallel settings
  n_jobs: -1                       # -1 = all CPUs for extraction; download is serial
  extraction_max_workers: 8        # cap for per-storm extraction workers (RAM-bound, ~1GB/worker)
  verbosity: 1                     # reserved (log verbosity of pipeline phases)

# =============================================================================
# 11. Logging
# =============================================================================
logging:
  level: "INFO"
  format: "<green>{time:YYYY-MM-DD HH:mm:ss}</green> | <level>{level: <8}</level> | <cyan>{name}</cyan>:<cyan>{function}</cyan>:<cyan>{line}</cyan> - <level>{message}</level>"
  file: "data/phase1/processed/logs/phase1.log"
  rotation: "10 MB"
  retention: "30 days"
